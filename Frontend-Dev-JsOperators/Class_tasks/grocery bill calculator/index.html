<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Bill Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Grocery Bill Calculator</h1>
        <div class="calculator-box">
            <div class="input-group">
                <label for="price">Price per Item (₹):</label>
                <input type="number" id="price" placeholder="Enter price" min="0" step="0.01">
            </div>
            
            <div class="input-group">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" placeholder="Enter quantity" min="1" value="1">
            </div>
            
            <button id="calculateBtn">Calculate Total</button>
            
            <div id="result" class="result hidden">
                <div class="result-item">
                    <span>Subtotal:</span>
                    <span id="subtotal">₹0.00</span>
                </div>
                <div class="result-item discount" id="discountSection">
                    <span>Discount (10%):</span>
                    <span id="discount">-₹0.00</span>
                </div>
                <div class="result-item final">
                    <span>Final Amount:</span>
                    <span id="finalAmount">₹0.00</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
