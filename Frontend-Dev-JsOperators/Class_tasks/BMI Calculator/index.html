<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <p class="subtitle">Check your Body Mass Index</p>
        
        <div class="calculator-box">
            <div class="input-group">
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" placeholder="Enter your weight" min="1" step="0.1">
            </div>
            
            <div class="input-group">
                <label for="height">Height (meters):</label>
                <input type="number" id="height" placeholder="Enter your height" min="0.1" step="0.01">
                <small>Example: 1.75 for 175cm</small>
            </div>
            
            <button id="calculateBtn">Calculate BMI</button>
            
            <div id="result" class="result hidden">
                <div class="bmi-value">
                    <span class="label">Your BMI:</span>
                    <span id="bmiValue" class="value">0</span>
                </div>
                
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar"></div>
                    <div class="progress-markers">
                        <span class="marker" style="left: 0%">0</span>
                        <span class="marker" style="left: 45%">18.5</span>
                        <span class="marker" style="left: 62.5%">25</span>
                        <span class="marker" style="left: 75%">30</span>
                        <span class="marker" style="left: 100%">40+</span>
                    </div>
                </div>
                
                <div id="category" class="category"></div>
                
                <div class="info-text" id="infoText"></div>
            </div>
            
            <div class="bmi-guide">
                <h3>BMI Categories:</h3>
                <div class="guide-item underweight">
                    <span class="color-box"></span>
                    <span>Underweight: &lt; 18.5</span>
                </div>
                <div class="guide-item normal">
                    <span class="color-box"></span>
                    <span>Normal: 18.5 - 24.9</span>
                </div>
                <div class="guide-item overweight">
                    <span class="color-box"></span>
                    <span>Overweight: 25 - 29.9</span>
                </div>
                <div class="guide-item obese">
                    <span class="color-box"></span>
                    <span>Obese: ≥ 30</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
