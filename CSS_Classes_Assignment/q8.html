<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Sizing Comparison</title>
  <link rel="stylesheet" href="q8.css">
</head>
<body>
  <main class="box-area">
    <div class="box default">
      <p>Default (content-box)</p>
    </div>
    <div class="box borderbox">
      <p>border-box</p>
    </div>
  </main>

  <p class="desc">
    The right box looks smaller because padding and border are included in total width.
  </p>
</body>
</html>
