<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo Classes Example</title>
  <link rel="stylesheet" href="q1.css">
</head>
<body>
  <header>
    <h1>Pseudo-Class Demonstration</h1>
  </header>

  <main class="container">
    <section class="example">
      <a href="#">Hover over me</a>
      <p>:hover changes color when the mouse is over the element.</p>
    </section>

    <section class="example">
      <button>Click me</button>
      <p>:active applies when button is being clicked.</p>
    </section>

    <section class="example">
      <input type="text" placeholder="Focus here">
      <p>:focus highlights input when active.</p>
    </section>

    <section class="example list">
      <ul>
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
      </ul>
      <p>:nth-child() targets specific list items.</p>
    </section>
  </main>
</body>
</html>
