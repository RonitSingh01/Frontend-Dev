<!DOCTYPE html>
<html>
<head>
  <title>Head Elements Example</title>
  <!-- charset defines character encoding -->
  <meta charset="UTF-8">
  <!-- description provides page summary -->
  <meta name="description" content="Example of head elements">
  <!-- author specifies the creator -->
  <meta name="author" content="Student">
  <!-- base sets base URL for links -->
  <base href="https://example.com/">
  <!-- link connects external resources -->
  <link rel="icon" href="favicon.ico">
  <!-- style defines internal CSS -->
  <style></style>
  <!-- script defines client-side JavaScript -->
  <script></script>
</head>
<body>
  <p>Example of all important head elements.</p>
</body>
</html>
