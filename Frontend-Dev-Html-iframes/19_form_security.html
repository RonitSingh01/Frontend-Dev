<!DOCTYPE html>
<html>
<head><title>Form Security</title></head>
<body>
  <form autocomplete="off">
    <input type="text" placeholder="Username" required><br>
    <input type="password" placeholder="Password" required><br>
    <button type="submit">Login</button>
  </form>
  <p>Disabling autocomplete can prevent sensitive data from being stored in the browser.</p>
</body>
</html>
