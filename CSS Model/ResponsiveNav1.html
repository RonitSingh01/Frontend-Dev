<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar Demo</title>
    <!-- Link the external CSS file -->
    <link rel="stylesheet" href="ResponsiveNav.css">
</head>
<body>
    <header>
        <!-- Navigation Bar (Horizontal on Desktop) -->
        <nav class="main-nav">
            <ul>
                <li><a href="#home" class="active">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#portfolio">Portfolio</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="content-placeholder">
            <h2>Welcome to the Responsive Layout</h2>
            <p>Try resizing your browser window (especially below 700px) to see the navigation bar stack vertically.</p>
        </section>
    </main>

    <!-- Footer Section with Centered Text -->
    <footer>
        <p>&copy; 2025 Nav Bar Demo | Responsive Design Practice</p>
    </footer>
</body>
</html>
