<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive CSS Photo Gallery</title>
    <!-- Load Tailwind CSS for base utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Photo.css">
</head>
<body>

    <h1 class="text-4xl font-extrabold text-center text-gray-800 mb-10">Art and Nature Gallery</h1>

    <div class="gallery-grid">

        <!-- Item 1 -->
        <div class="gallery-item">
            <img src="https://placehold.co/400x400/2563eb/ffffff?text=Abstract+Lines" alt="Abstract Lines">
            <div class="caption-overlay">
                <span class="caption-text">Abstract Lines: Digital Creation</span>
            </div>
        </div>

        <!-- Item 2 -->
        <div class="gallery-item">
            <img src="https://placehold.co/400x400/059669/ffffff?text=Forest+Mist" alt="Forest Mist">
            <div class="caption-overlay">
                <span class="caption-text">Forest Mist: Morning Hike</span>
            </div>
        </div>

        <!-- Item 3 -->
        <div class="gallery-item">
            <img src="https://placehold.co/400x400/ea580c/ffffff?text=Desert+Sunset" alt="Desert Sunset">
            <div class="caption-overlay">
                <span class="caption-text">Desert Sunset: High Contrast</span>
            </div>
        </div>
        
        <!-- Item 4 -->
        <div class="gallery-item">
            <img src="https://placehold.co/400x400/9333ea/ffffff?text=Geometric+Shapes" alt="Geometric Shapes">
            <div class="caption-overlay">
                <span class="caption-text">Geometric Shapes: Purple Hues</span>
            </div>
        </div>

        <!-- Item 5 -->
        <div class="gallery-item">
            <img src="https://placehold.co/400x400/d946ef/ffffff?text=Cityscape+Rain" alt="Cityscape Rain">
            <div class="caption-overlay">
                <span class="caption-text">Cityscape Rain: Reflections</span>
            </div>
        </div>

        <!-- Item 6 -->
        <div class="gallery-item">
            <img src="https://placehold.co/400x400/475569/ffffff?text=Mountain+View" alt="Mountain View">
            <div class="caption-overlay">
                <span class="caption-text">Mountain View: Serene Peaks</span>
            </div>
        </div>
        
        <!-- Item 7 (Extra) -->
        <div class="gallery-item">
            <img src="https://placehold.co/400x400/f59e0b/ffffff?text=Warm+Tones" alt="Warm Tones">
            <div class="caption-overlay">
                <span class="caption-text">Warm Tones: Studio Portrait</span>
            </div>
        </div>

        <!-- Item 8 (Extra) -->
        <div class="gallery-item">
            <img src="https://placehold.co/400x400/22c55e/ffffff?text=Green+Lush" alt="Green Lush">
            <div class="caption-overlay">
                <span class="caption-text">Green Lush: Vibrant Foliage</span>
            </div>
        </div>

    </div>

</body>
</html>
