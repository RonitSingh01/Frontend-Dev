<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jane Doe - Portfolio</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="bg-primary text-white p-4">
        <div class="container">
            <h1 class="mb-0">Jane Doe</h1> </div>
    </header>

    <main>
        
        <section class="p-5 bg-light text-center">
            <div class="container">
                
                <div class="mt-4 mb-4"> 
                    <img src="https://picsum.photos/200/200?random=2" 
                         alt="Jane Doe Profile" 
                         class="img-fluid rounded-circle border border-primary border-4 profile-img shadow-lg">
                </div>

                <h2 class="fw-bold mb-3 text-dark">Full Stack Developer | UI/UX Enthusiast</h2>
                <p class="lead text-muted">
                    Building responsive and scalable web applications with a focus on clean code and user-centric design.
                </p>

                <div class="mt-4 mb-5">
                    <a href="#" class="btn btn-primary btn-lg me-2">
                        Hire Me
                    </a>
                    <a href="#" class="btn btn-outline-secondary btn-lg">
                        Download CV
                    </a>
                </div>
            </div>
        </section>
        
        <section class="p-4">
            <div class="container mt-4 mb-5">
                <h3 class="text-center mb-4 text-dark">Get In Touch</h3>
                
                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6"> 
                        <form>
                            <div class="mb-3">
                                <label for="inputName" class="form-label">Name</label>
                                <input type="text" class="form-control" id="inputName" placeholder="Your Name">
                            </div>

                            <div class="mb-3">
                                <label for="inputEmail" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="inputEmail" placeholder="name@example.com">
                            </div>

                            <div class="mb-3">
                                <label for="inputMessage" class="form-label">Message</label>
                                <textarea class="form-control" id="inputMessage" rows="3" placeholder="I'd like to chat about..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-success mt-3 w-100">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
        
    </main>

    <footer class="bg-dark text-white-50 p-3 text-center">
        <div class="container">
            <p class="mb-0">Connect with me on LinkedIn & GitHub.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>
</body>
</html>
