<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="p-3 bg-dark text-white shadow-sm mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0">
                Task List 
                <span class="badge bg-danger rounded-pill align-middle fs-6 ms-2">
                    4 Pending
                </span>
            </h1>
            
            <button type="button" class="btn btn-outline-light position-relative">
                Completed
                <span class="badge bg-success rounded-pill position-absolute top-0 start-100 translate-middle">
                    2
                    <span class="visually-hidden">Completed Tasks</span>
                </span>
            </button>
        </div>
    </header>

    <main class="py-4">
        <div class="container">
            
            <div class="card shadow-lg">
                <div class="card-header bg-light fw-bold fs-5">
                    Today's Focus
                </div>
                
                <ul class="list-group list-group-flush">
                    
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span class="task-title">Review Q3 Budget Report</span>
                        <span class="badge bg-danger rounded-pill">High</span>
                    </li>
                    
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span class="task-title">Schedule team feedback session</span>
                        <span class="badge bg-warning text-dark rounded-pill">Medium</span>
                    </li>
                    
                    <li class="list-group-item d-flex justify-content-between align-items-center text-decoration-line-through text-muted list-group-item-success">
                        <span class="task-title">Update local dev environment</span>
                        <span class="badge bg-secondary rounded-pill">Done</span>
                    </li>

                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span class="task-title">Finalize client proposal document</span>
                        <span class="badge bg-danger rounded-pill">High</span>
                    </li>

                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span class="task-title">Research new marketing tools</span>
                        <span class="badge bg-warning text-dark rounded-pill">Medium</span>
                    </li>

                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span class="task-title">Clear email backlog and archives</span>
                        <span class="badge bg-success rounded-pill">Low</span>
                    </li>
                    
                </ul>
            </div>
            
        </div>
    </main>

    <footer class="bg-light text-muted py-3 mt-5">
        <div class="container text-center">
            <p class="mb-0">Task Manager v1.0</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>
</body>
</html>
