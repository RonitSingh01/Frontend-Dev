<!-- 14. Just below the header, create a <nav> section containing three links — Home, About, and
Contact.
Links can use # as placeholders. -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Website</title>
  </head>
  <body>
    <header>
      <h1>Welcome to My Website</h1>
      <nav>
        <a href="#Home">Home</a>
        <a href="#About">About</a>
        <a href="#Contact">Contact</a>
      </nav>
    </header>
    <main>
      <section id="home">
        <h2>Home</h2>
        <p>Hi, Welcome to my website.</p>
      </section>

      <section id="about">
        <h2>About Me</h2>
        <p>I am Ronit Singh from Bharatpur, Rajasthan.</p>
      </section>

      <section id="contact">
        <h2>My Contact</h2>
        <p>Here, You can contact me.</p>
      </section>
    </main>
  </body>
</html>
