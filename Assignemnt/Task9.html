<!-- 9. Create a paragraph that uses both <strong> and <em> to emphasize different parts of a
sentence. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>I am <strong>Ronit</strong><em>Singh</em></p>
</body>
</html>
