<!-- 12. Create a creative paragraph combining multiple inline elements (<strong>, <em>,
<mark>, <small>, <br>) to demonstrate inline formatting. -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p>
      Hey , Who are <strong>you</strong>? Looking <em>very</em>
      <mark>handsome</mark>. <br />
      I am Ronit <small>from</small> Mathura.
    </p>
  </body>
</html>
