<!-- 8. Write a paragraph containing:
● A highlighted word using <mark>
● A small note at the end using <small> (e.g., “Updated recently”). -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <mark>Love</mark> <br>
    Life is useless without having <small>love</small> in your life.
</body>
</html>
