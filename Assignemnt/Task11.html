<!-- 11. Write a paragraph that contains three <span> elements — use them to highlight or label
different parts of the text (you can imagine colors or meanings). -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <p>
      I have been <span>studying</span> since <span>I</span> was
      <span>4</span>years old.
    </p>
  </body>
</html>
