<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Selection</title>
</head>
<body>
  <h1>Choose Your Travel Preferences</h1>

  <label for="country">Country:</label>
  <select id="country">
    <option selected>India</option>
    <option>USA</option>
    <option>France</option>
  </select><br><br>

  <label for="state">State:</label>
  <select id="state">
    <option selected>Karnataka</option>
    <option>Maharashtra</option>
    <option>Rajasthan</option>
  </select><br><br>

  <label for="city">City:</label>
  <select id="city">
    <option selected>Bengaluru</option>
    <option>Mumbai</option>
    <option>Jaipur</option>
  </select><br><br>

  <label for="tourist">Favorite Tourist Place:</label>
  <select id="tourist">
    <option selected>Palace</option>
    <option>Beach</option>
    <option>Museum</option>
  </select>

  <p>You selected India, Karnataka, Bengaluru, and Palace as your favorite tourist place.</p>
</body>
</html>
